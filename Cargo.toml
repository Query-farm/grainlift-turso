[package]
name = "grainlift-turso"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "An ADBC service for Turso databases, built with the Grainlift server library"
repository = "https://github.com/Query-farm/grainlift-turso"
publish = false

# Keep this crate independent when it is checked out beneath another workspace.
[workspace]

[dependencies]
# Use the same arrow-adbc revision as grainlift-server so the ADBC types match.
adbc_core = { git = "https://github.com/apache/arrow-adbc.git", rev = "c942d481c6e083040c68676e3dd454dad89503e9" }
arrow-array = "60"
arrow-cast = "60"
arrow-json = "60"
arrow-schema = "60"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }
# grainlift v0.4.2; CI builds the native ADBC driver from this same revision.
grainlift-server = { git = "https://github.com/Query-farm/grainlift.git", rev = "07850074d5c358ce8809fadddd9223d4ea0854d2" }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
# The same version as turso_serverless, for streamed Turso Cloud results.
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# The Turso Database engine. `turso` supplies the value type; the engine is
# driven through `turso_sdk_kit` (the layer beneath `turso`), which exposes
# statement interrupts and busy timeouts.
turso = "0.8.1"
turso_core = { version = "0.8.1", default-features = false }
turso_sdk_kit = "0.8.1"
# Turso Cloud over its SQL-over-HTTP protocol.
turso_serverless = "0.1.3"
vgi-rpc = { version = "0.28.2", default-features = false, features = ["http", "jwt-jsonwebtoken", "tcp-mtls"] }

[dev-dependencies]
adbc_driver_manager = { git = "https://github.com/apache/arrow-adbc.git", rev = "c942d481c6e083040c68676e3dd454dad89503e9" }
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
